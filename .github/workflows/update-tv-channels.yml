name: Update TV Channels

on:
  # Automatic daily schedule disabled — tournament ended July 19, 2026.
  # Re-add a `schedule: - cron: '0 7 * * *'` entry here for the next one.
  workflow_dispatch:
    # Manual "Run workflow" button for testing or immediate refresh

jobs:
  update-channels:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install @supabase/supabase-js

      - name: Sync TV Channels
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync-tv-channels.js
