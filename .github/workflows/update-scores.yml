name: Update Live Scores

on:
  schedule:
    # Every 5 minutes during tournament hours (06:00–23:55 UTC)
    # ~216 calls/day — well within Starter plan (7,500/day)
    - cron: '*/5 6-23 * * *'
  workflow_dispatch:
    # Manual "Run workflow" button in GitHub Actions tab for testing

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install @supabase/supabase-js node-fetch

      - name: Run Score Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/sync-scores.js
