name: Sync Live Scores

on:
  schedule:
    # Runs every 5 minutes — GitHub's minimum for scheduled workflows.
    # During the World Cup (June 11 – July 19 2026) this keeps scores
    # current within 5 minutes of real time. The script skips the API
    # call entirely on days with no scheduled matches, so quota is only
    # consumed on actual match days.
    - cron: '*/5 * * * *'
  workflow_dispatch: # Manual trigger from the GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run score sync
        run: node scripts/sync-scores.js
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          API_FOOTBALL_KEY:    ${{ secrets.API_FOOTBALL_KEY }}
