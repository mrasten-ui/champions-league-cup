name: Sync Live Scores

on:
  # Automatic 5-minute schedule disabled — tournament ended July 19, 2026.
  # Re-add a `schedule: - cron: '*/5 * * * *'` entry here for the next one.
  workflow_dispatch: # Manual trigger from the GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run score sync
        run: node scripts/sync-scores.js
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          API_FOOTBALL_KEY:    ${{ secrets.API_FOOTBALL_KEY }}

      - name: Sync player match stats
        run: node scripts/sync-player-stats.js
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          API_FOOTBALL_KEY:    ${{ secrets.API_FOOTBALL_KEY }}
