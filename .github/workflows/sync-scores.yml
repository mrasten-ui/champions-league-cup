name: Sync Live Scores

on:
  # Automatic schedule disabled — was pointed at the old World Cup sync script
  # (scripts/sync-scores.js) and needs re-adding once you're ready to go live
  # for the 2026/27 League Phase (kicks off 2026-09-08). Re-add e.g.
  # `schedule: - cron: '*/5 * * * *'` here; sync-scores-uefa.mjs self-throttles
  # (live/window/skip tiers based on kickoff proximity) so a tight cron is safe.
  workflow_dispatch: # Manual trigger from the GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run score sync
        run: node scripts/sync-scores-uefa.mjs
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
